name: Get Site Settings

on:
  workflow_dispatch:
    inputs:
      expect_title:
        description: "Check whether the live title equals this (optional)"
        required: false
        default: ""

jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Check settings
        env:
          WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          ARGS=()
          if [ -n "${{ github.event.inputs.expect_title }}" ]; then
            ARGS+=(--expect-title "${{ github.event.inputs.expect_title }}")
          fi
          python scripts/get_site_settings.py "${ARGS[@]}"
