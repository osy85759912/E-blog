name: Debug Commons Metadata

on:
  workflow_dispatch:
    inputs:
      titles:
        description: "Pipe-separated Commons File: titles"
        required: true

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Dump metadata
        run: python scripts/debug_commons_metadata.py --titles "${{ github.event.inputs.titles }}"
