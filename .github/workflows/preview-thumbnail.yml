name: Preview Thumbnail

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "Ticker for logo lookup"
        required: true
        default: "AAPL"
      person:
        description: "Person name for Commons photo lookup (optional)"
        required: false
        default: ""
      title:
        description: "Post title for the caption"
        required: true
        default: "썸네일 디자인 미리보기 테스트"
      mood:
        description: "호재/악재/패닉/중립"
        required: true
        default: "호재"
      market:
        description: "kr (코스피/코스닥) or us (S&P500/나스닥)"
        required: false
        default: "us"
      date:
        description: "As-of date YYYY-MM-DD for the % change shown (blank = latest trading day)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install fonts + cairo (thumbnail rendering)
        run: sudo apt-get update && sudo apt-get install -y fonts-nanum libcairo2

      - run: pip install -r requirements.txt

      - name: Generate thumbnail
        run: |
          mkdir -p scratch
          OUT="scratch/preview-${{ github.run_id }}.png"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          ARGS=(--ticker "${{ github.event.inputs.ticker }}" --title "${{ github.event.inputs.title }}" --mood "${{ github.event.inputs.mood }}" --market "${{ github.event.inputs.market }}" --out "$OUT")
          if [ -n "${{ github.event.inputs.person }}" ]; then
            ARGS+=(--person "${{ github.event.inputs.person }}")
          fi
          if [ -n "${{ github.event.inputs.date }}" ]; then
            ARGS+=(--date "${{ github.event.inputs.date }}")
          fi
          python scripts/generate_thumbnail.py "${ARGS[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: thumbnail-preview-${{ github.run_id }}
          path: ${{ env.OUT }}

      - name: Commit preview image for easy viewing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "$OUT"
          git commit -m "Add thumbnail preview render ($OUT)"
          for i in 1 2 3 4; do
            git push && break
            git pull --rebase origin "${{ github.ref_name }}"
            sleep $((i * 2))
          done
