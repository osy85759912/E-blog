name: Set Post Status

on:
  workflow_dispatch:
    inputs:
      title_search:
        description: "Substring to find the post by title"
        required: true
      status:
        description: "New status (publish/draft/pending/future)"
        required: true
        default: "publish"

jobs:
  set-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Set post status
        env:
          WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          python scripts/set_post_status.py \
            --title-search "${{ github.event.inputs.title_search }}" \
            --status "${{ github.event.inputs.status }}"
