name: Update Post

on:
  workflow_dispatch:
    inputs:
      title_search:
        description: "Substring to find the post by title"
        required: true
      tickers:
        description: "Comma-separated tickers to regenerate the chart for"
        required: true
      publish:
        description: "Publish live (true/false)"
        required: false
        default: "false"

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install fonts (chart rendering)
        run: sudo apt-get update && sudo apt-get install -y fonts-nanum

      - run: pip install -r requirements.txt

      - name: Regenerate chart and update post
        env:
          WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          ARGS="--title-search '${{ github.event.inputs.title_search }}' --tickers '${{ github.event.inputs.tickers }}'"
          if [ "${{ github.event.inputs.publish }}" = "true" ]; then
            ARGS="$ARGS --publish"
          fi
          eval python scripts/update_post.py $ARGS
