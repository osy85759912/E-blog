name: Install WordPress Plugin

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "WordPress.org plugin slug"
        required: true
      activate:
        description: "Activate after install (true/false)"
        required: false
        default: "true"

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Install plugin
        env:
          WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          ARGS="--slug '${{ github.event.inputs.slug }}'"
          if [ "${{ github.event.inputs.activate }}" = "true" ]; then
            ARGS="$ARGS --activate"
          fi
          eval python scripts/install_plugin.py $ARGS
