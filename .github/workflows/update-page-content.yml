name: Update Page Content

on:
  workflow_dispatch:
    inputs:
      page_id:
        description: "WordPress page ID"
        required: true
      content_file:
        description: "Path (in repo) to the HTML content file"
        required: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Update page content
        env:
          WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python scripts/update_page_content.py --page-id "${{ github.event.inputs.page_id }}" --content-file "${{ github.event.inputs.content_file }}"
